<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GeoParquemet · RA</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="icons/favicon.png?v=2">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  /* #marco recorta: el estabilizador agranda y mueve #escena, y sin recorte el teléfono ensancha la página */
  #marco { position: fixed; inset: 0; overflow: hidden; contain: strict; }
  #escena { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; }
  #escena video { object-fit: cover; }
  .barra { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; background: linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,0)); }
  .barra button { border: 0; background: rgba(255,255,255,.18); color: #fff; border-radius: 10px; padding: 8px 12px; font-size: 1rem; font-weight: 700; }
  .barra b { flex: 1; font-size: .95rem; text-shadow: 0 1px 3px #000; }
  .panel { position: fixed; left: 10px; right: 10px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 10; background: rgba(20,28,24,.88); border-radius: 16px; padding: 12px 14px; max-width: 560px; margin: 0 auto; backdrop-filter: blur(6px); }
  .panel p { margin: 0 0 8px; }
  .miniaturas { display: flex; gap: 8px; overflow-x: auto; }
  .miniaturas button { flex: none; border: 2px solid rgba(255,255,255,.35); border-radius: 10px; padding: 0; background: none; width: 84px; height: 112px; overflow: hidden; }
  .miniaturas button.activo { border-color: #e08a00; }
  .miniaturas img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .deslizador { display: flex; align-items: center; gap: 10px; font-size: .82rem; }
  .deslizador input { flex: 1; accent-color: #e08a00; height: 28px; }
  .ok { color: #7ee07e; font-weight: 700; }
  .aviso { font-size: .8rem; opacity: .8; margin-top: 8px; }
  .aviso a { color: #ffc766; }
  #cargando { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; text-align: center; background: #000; padding: 20px; }
  #foto-prueba { position: fixed; inset: 0; z-index: 30; background: #000; display: grid; place-items: center; }
  #foto-prueba img { max-width: 100%; max-height: 100%; }
  #foto-prueba button { position: fixed; top: 14px; right: 14px; border: 0; border-radius: 999px; width: 44px; height: 44px; font-size: 1.2rem; }
  /* carteles de divulgación: HTML sobre la cámara, anclados a la roca en cada cuadro */
  #carteles { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  #carteles svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #carteles line { stroke: #fff; stroke-width: 2; marker-end: url(#flecha); filter: drop-shadow(0 0 2px rgba(0,0,0,.9)); }
  .punto { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.35); animation: latido 1.6s ease-in-out infinite; }
  @keyframes latido { 50% { transform: scale(1.35); } }
  /* solo el ícono, en una insignia pequeña: los textos tapaban las líneas de fractura; el título va en la ficha */
  .cartel { position: absolute; pointer-events: auto; transform: translate(-50%, -50%); display: grid; place-items: center; width: 38px; height: 38px; padding: 0;
    background: rgba(255,255,255,.96); border: 3px solid var(--c); border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,.5); animation: aparece .35s ease-out both; }
  .cartel .ic { font-size: 1.15rem; line-height: 1; }
  .cartel.activo { outline: 3px solid #ffc766; }
  @keyframes aparece { from { transform: translate(-50%, -50%) scale(.6); opacity: 0; } }
  .fila { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: .8rem; }
  .fila button { border: 0; border-radius: 999px; padding: 6px 12px; font-weight: 700; background: #e08a00; color: #111; }
  .fila button[aria-pressed="false"] { background: rgba(255,255,255,.2); color: #fff; }
  #ficha h3 { margin: 0 0 6px; font-size: 1.05rem; display: flex; gap: 8px; align-items: center; }
  #ficha h3 span { font-size: 1.5rem; }
  #ficha .curioso { margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.1); font-size: .88rem; }
  #ficha .curioso b { display: block; margin-bottom: 2px; color: #ffc766; }
  #ficha .oir { border: 0; border-radius: 999px; padding: 6px 12px; margin: 0 0 8px; font-weight: 700; background: #e08a00; color: #111; }
  #ficha .oir.sonando { background: #ffc766; }
  #ficha .cerrar { float: right; border: 0; border-radius: 999px; width: 34px; height: 34px; margin: -4px -4px 0 8px; font-size: 1rem; background: rgba(255,255,255,.2); color: #fff; }
  [hidden] { display: none !important; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<div id="marco"><div id="escena"></div></div>
<div id="carteles" hidden><svg><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#fff"/></marker></defs></svg></div>
<div class="barra"><button id="volver" aria-label="←">←</button><b id="titulo"></b></div>
<div class="panel">
  <div id="buscando">
    <p id="txt-apunta"></p>
    <div class="miniaturas" id="miniaturas"></div>
    <p class="aviso" id="txt-prueba"></p>
  </div>
  <div id="viendo" hidden>
    <p class="ok" id="txt-encontrado"></p>
    <div class="deslizador"><span id="txt-roca"></span><input type="range" id="opacidad" min="0" max="100" value="85"><span id="txt-interp"></span></div>
    <div class="fila"><button id="btn-fijar" aria-pressed="false"></button><button id="btn-carteles" aria-pressed="true" hidden></button><span id="txt-toca" hidden></span></div>
  </div>
  <div id="ficha" hidden></div>
</div>
<div id="cargando"><div><p id="txt-cargando">…</p><p id="error" hidden></p></div></div>
<div id="foto-prueba" hidden><img alt=""><button aria-label="✕">✕</button></div>

<script src="i18n.js"></script>
<script type="module">
import * as THREE from 'three';
import { MindARThree } from './vendor/mindar/mindar-image-three.prod.js';
import { crearGimbal, aplicar, css } from './estabilizador.js';

const $ = s => document.querySelector(s);
let LANG = 'es';
try { LANG = JSON.parse(localStorage.getItem('geoparquemet:idioma')) || 'es'; } catch { }
if (!TXT[LANG]) LANG = 'es';
const t = (k, v) => { let s = TXT[LANG][k] ?? TXT.es[k] ?? k; if (v) s = s.replace(/\{(\w+)\}/g, (_, x) => v[x] ?? ''); return s; };
document.documentElement.lang = LANG;

const n = new URLSearchParams(location.search).get('g') || '1';
$('#volver').onclick = () => { location.href = './#/g/' + n; };
$('#titulo').textContent = t('ra_titulo', { n });
$('#txt-apunta').textContent = t('ra_apunta');
$('#txt-encontrado').textContent = t('ra_encontrado');
$('#txt-roca').textContent = t('ra_roca');
$('#txt-interp').textContent = t('ra_interp');
$('#txt-cargando').textContent = t('ra_cargando');
$('#txt-prueba').innerHTML = t('ra_prueba');

const fallo = msg => { $('#cargando').hidden = false; $('#txt-cargando').hidden = true; const e = $('#error'); e.hidden = false; e.innerHTML = msg + `<br><br><button onclick="location.href='./#/g/${n}'">←</button>`; };

const objetivos = await fetch('ar/objetivos.json').then(r => r.json()).catch(() => ({}));
const o = objetivos[n];
if (!o) { fallo(t('ra_no_hay')); throw new Error('sin objetivos'); }

// miniaturas: muestran qué encuadre buscar; al tocar una se ve en grande (sirve para probar desde otro teléfono o pantalla)
$('#miniaturas').innerHTML = o.pares.map((p, i) => `<button data-i="${i}"><img src="${p.obj}" alt=""></button>`).join('');
$('#miniaturas').onclick = e => { const b = e.target.closest('button'); if (!b) return; const f = $('#foto-prueba'); f.querySelector('img').src = o.pares[+b.dataset.i].obj; f.hidden = false; };
$('#foto-prueba button').onclick = () => $('#foto-prueba').hidden = true;

if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { fallo(t('ra_sin_camara')); throw new Error('sin cámara'); }

// estabilizador (gimbal virtual): mueve video y capa JUNTOS para cancelar el pulso; ?gimbal=0 vuelve al filtro fuerte de antes
const Q = new URLSearchParams(location.search);
const GIMBAL = Q.get('gimbal') !== '0';
const mind = new MindARThree({
  container: $('#escena'), imageTargetSrc: o.mind, maxTrack: 1,
  uiLoading: 'no', uiScanning: 'no', uiError: 'no',
  // con gimbal el filtro de MindAR solo quita el ruido del tracker (un filtro fuerte hace que la capa llegue tarde y "nade" sobre la roca)
  filterMinCF: +(Q.get('mincf') || (GIMBAL ? 0.001 : 0.0001)), filterBeta: +(Q.get('beta') || (GIMBAL ? 1 : 0.004)),
});
const { renderer, scene, camera } = mind;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const cargador = new THREE.TextureLoader();
const materiales = [], anclas = [];
o.pares.forEach((p, i) => {
  const tex = cargador.load(p.capa);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: .85, depthWrite: false });
  materiales.push(mat);
  // MindAR mide el objetivo con ancho 1: el plano tiene la proporción de la foto
  const plano = new THREE.Mesh(new THREE.PlaneGeometry(1, p.h / p.w), mat);
  const ancla = mind.addAnchor(i);
  anclas.push(ancla);
  ancla.group.add(plano);
  ancla.onTargetFound = () => {
    activo = i; gimbal.reiniciar();
    $('#buscando').hidden = true; $('#viendo').hidden = !!abierto;
    document.querySelectorAll('.miniaturas button').forEach((b, j) => b.classList.toggle('activo', j === i));
    if (navigator.vibrate) try { navigator.vibrate(60); } catch { }
  };
  ancla.onTargetLost = () => { if (activo === i) activo = -1; gimbal.reiniciar(); fijar(false); $('#buscando').hidden = false; $('#viendo').hidden = true; $('#ficha').hidden = true; abierto = null; voz.pause(); capaCarteles.hidden = true; };
});
$('#opacidad').oninput = e => materiales.forEach(m => m.opacity = e.target.value / 100);

// ---------- carteles de divulgación ----------
// ar/carteles.json trae los textos; cada par de objetivos.json trae dónde apunta cada cartel en su foto (x, y de 0 a 1).
const CARTELES = (await fetch('ar/carteles.json').then(r => r.json()).catch(() => ({})))[n] || [];
const capaCarteles = $('#carteles'), svg = capaCarteles.querySelector('svg');
let visibles = true, activo = -1, abierto = null;
const voz = new Audio();   // audio corto de cada cartel: ar/audio/<idioma>/g<N>_<id>.mp3
voz.preload = 'auto';
try { visibles = JSON.parse(localStorage.getItem('geoparquemet:carteles') ?? 'true'); } catch { }
const tx = v => (v && (v[LANG] || v.es)) || '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const elementos = CARTELES.map(c => {
  const punto = Object.assign(document.createElement('div'), { className: 'punto' });
  punto.style.background = c.color2 ? `linear-gradient(90deg, ${c.color} 50%, ${c.color2} 50%)` : c.color;
  const b = document.createElement('button');
  b.className = 'cartel'; b.style.setProperty('--c', c.color);
  b.innerHTML = `<span class="ic">${c.icono}</span>`; b.setAttribute('aria-label', tx(c.titulo)); b.title = tx(c.titulo);
  b.onclick = () => abrir(c, b);
  const linea = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  svg.appendChild(linea); capaCarteles.append(punto, b);
  return { c, punto, b, linea };
});
function abrir(c, b) {
  abierto = c.id;
  elementos.forEach(e => e.b.classList.toggle('activo', e.b === b));
  const f = $('#ficha');
  f.innerHTML = `<button class="cerrar" aria-label="${esc(t('ra_cerrar'))}">✕</button><h3><span>${c.icono}</span>${esc(tx(c.titulo))}</h3>`
    + `<button class="oir"></button><p>${esc(tx(c.texto))}</p><div class="curioso"><b>${esc(t('ra_curiosos'))}</b>${esc(tx(c.curioso))}</div>`;
  f.querySelector('.cerrar').onclick = cerrar;
  const oir = f.querySelector('.oir');
  const pintarOir = () => { const on = !voz.paused && !voz.ended; oir.textContent = t(on ? 'ra_pausa' : 'ra_escuchar'); oir.classList.toggle('sonando', on); };
  voz.onplay = voz.onpause = voz.onended = pintarOir;
  oir.onclick = () => { if (voz.paused || voz.ended) { if (voz.ended) voz.currentTime = 0; voz.play().catch(() => { }); } else voz.pause(); };
  voz.src = `ar/audio/${LANG}/g${n}_${c.id}.mp3`;
  voz.play().catch(() => { });   // el toque en el cartel permite reproducir
  pintarOir();
  f.hidden = false; $('#viendo').hidden = true;
}
function cerrar() {
  abierto = null; $('#ficha').hidden = true; voz.pause();
  elementos.forEach(e => e.b.classList.remove('activo'));
  if (activo >= 0) $('#viendo').hidden = false;
}
if (CARTELES.length) {
  $('#txt-toca').textContent = t('ra_toca');
  const boton = $('#btn-carteles');
  boton.hidden = false;
  boton.textContent = t('ra_carteles');
  const pintar = () => { boton.setAttribute('aria-pressed', String(visibles)); $('#txt-toca').hidden = !visibles; if (!visibles) capaCarteles.hidden = true; };
  boton.onclick = () => { visibles = !visibles; try { localStorage.setItem('geoparquemet:carteles', JSON.stringify(visibles)); } catch { } pintar(); };
  pintar();
}
const v3 = new THREE.Vector3();
// punto de la foto objetivo (x, y de 0 a 1) → píxeles de #escena con la pose cruda del tracker (sin estabilizar)
function aEscena(ancla, p, x, y) {
  v3.set(x - .5, (.5 - y) * p.h / p.w, 0).applyMatrix4(ancla.group.matrix).project(camera);
  return [(v3.x + 1) / 2 * innerWidth, (1 - v3.y) / 2 * innerHeight];
}
// ... y a pantalla, con la misma transformación del estabilizador que mueve el video y la capa
const aPantalla = (ancla, p, x, y) => aplicar(gimbal.M, ...aEscena(ancla, p, x, y));

// ---------- estabilizador (gimbal virtual, ver estabilizador.js) ----------
const gimbal = crearGimbal({ zoom: GIMBAL ? 1.08 : 1 });
let tPrev = 0;
function estabilizar() {
  const ahora = performance.now(), dt = Math.min(.1, (ahora - (tPrev || ahora)) / 1000) || 1 / 30;
  tPrev = ahora;
  if (!GIMBAL) return;
  const W = innerWidth, H = innerHeight;
  if (activo < 0 || !anclas[activo].group.visible) { $('#escena').style.transform = css(gimbal.libre(W, H)); return; }
  const v = mind.video.style, caja = { l: parseFloat(v.left) || 0, t: parseFloat(v.top) || 0, w: parseFloat(v.width) || W, h: parseFloat(v.height) || H };
  const R = [[0, 0], [1, 0], [1, 1], [0, 1]].map(([x, y]) => aEscena(anclas[activo], o.pares[activo], x, y));
  $('#escena').style.transform = css(gimbal.paso(R, dt, W, H, caja));
}
// para medir en la prueba simulada: esquinas de la capa en pantalla
window.__ra = () => activo >= 0 && anclas[activo].group.visible ? [[0, 0], [1, 0], [1, 1], [0, 1]].map(([x, y]) => aPantalla(anclas[activo], o.pares[activo], x, y)) : null;

// ---------- fijar: congela el cuadro para mirar con calma sin seguir apuntando ----------
let fijo = false;
function fijar(on) {
  fijo = on;
  const b = $('#btn-fijar'); b.textContent = t(on ? 'ra_seguir' : 'ra_fijar'); b.setAttribute('aria-pressed', String(on));
  const v = mind.video; if (v) { if (on) v.pause(); else if (v.paused) v.play().catch(() => { }); }
}
$('#btn-fijar').onclick = () => fijar(!fijo);
fijar(false);
function ubicarCarteles() {
  const p = o.pares[activo], pos = p && p.carteles;
  if (!visibles || !pos || !anclas[activo].group.visible) { capaCarteles.hidden = true; return; }
  capaCarteles.hidden = false;
  const alto = innerHeight - $('.panel').getBoundingClientRect().height - 24;   // no tapar el panel de abajo
  for (const e of elementos) {
    const q = pos[e.c.id];
    e.punto.hidden = e.b.hidden = !q; e.linea.style.display = q ? '' : 'none';
    if (!q) continue;
    const [ax, ay] = aPantalla(anclas[activo], p, q[0], q[1]);
    let [lx, ly] = aPantalla(anclas[activo], p, q[0] + e.c.dx, q[1] + e.c.dy);
    const m = 38 / 2 + 6, mh = 38 / 2 + 6;
    lx = Math.min(Math.max(lx, m), innerWidth - m); ly = Math.min(Math.max(ly, mh + 60), alto - mh);
    e.ax = ax; e.ay = ay; e.lx = lx; e.ly = ly; e.w = e.h = 38;
  }
  // si dos carteles se tapan, se separan en vertical (el de más abajo baja, o sube si no cabe)
  const vivos = elementos.filter(e => !e.b.hidden).sort((a, b) => a.ly - b.ly);
  for (let pasada = 0; pasada < 3; pasada++)
    for (let i = 0; i < vivos.length; i++) for (let j = i + 1; j < vivos.length; j++) {
      const a = vivos[i], b = vivos[j];
      const sepY = (a.h + b.h) / 2 + 6 - Math.abs(b.ly - a.ly);
      if (Math.abs(b.lx - a.lx) < (a.w + b.w) / 2 + 6 && sepY > 0) {
        if (b.ly + sepY + b.h / 2 < alto) b.ly += sepY; else a.ly -= sepY;
      }
    }
  for (const e of vivos) {
    e.punto.style.left = e.ax + 'px'; e.punto.style.top = e.ay + 'px';
    e.b.style.left = e.lx + 'px'; e.b.style.top = e.ly + 'px';
    const dx = e.ax - e.lx, dy = e.ay - e.ly, d = Math.hypot(dx, dy) || 1;   // insignia → roca; la flecha termina en el punto
    e.linea.style.display = d > 30 ? '' : 'none';
    e.linea.setAttribute('x1', e.lx + dx / d * 20); e.linea.setAttribute('y1', e.ly + dy / d * 20);
    e.linea.setAttribute('x2', e.ax - dx / d * 9); e.linea.setAttribute('y2', e.ay - dy / d * 9);
  }
}

// ---------- video sincronizado con la pose ----------
// MindAR entrega la pose ~50 ms después del cuadro que se ve: la capa siempre llega tarde y el estabilizador corregiría
// un movimiento que ya pasó. Con un objetivo a la vista se muestra en su lugar EL MISMO cuadro que analizó el tracker
// (copiado a un canvas justo cuando MindAR lo lee), así capa y roca coinciden en cada cuadro.

function sincronizarVideo() {
  const v = mind.video, ctl = mind.controller, carga = ctl.inputLoader, leer = carga.loadInput.bind(carga), avisar = ctl.onUpdate;
  const cuadros = [0, 1].map(() => {
    const c = document.createElement('canvas'); c.hidden = true;
    Object.assign(c.style, { position: 'absolute', zIndex: -2 });
    v.after(c); return c;
  });
  let sig = 0;
  carga.loadInput = x => {
    const c = cuadros[sig];
    if (c.width !== v.videoWidth || c.height !== v.videoHeight) { c.width = v.videoWidth; c.height = v.videoHeight; }
    c.getContext('2d', { alpha: false }).drawImage(v, 0, 0);
    return leer(x);
  };
  ctl.onUpdate = d => {
    avisar(d);
    if (d.type !== 'processDone') return;
    const ver = activo >= 0, c = cuadros[sig], otro = cuadros[sig ^ 1];
    if (ver) for (const k of ['left', 'top', 'width', 'height']) c.style[k] = v.style[k];
    c.hidden = !ver; otro.hidden = true; sig ^= 1;
  };
}

try {
  await mind.start();
  if (GIMBAL) sincronizarVideo();
  $('#cargando').hidden = true;
  renderer.setAnimationLoop(() => { estabilizar(); renderer.render(scene, camera); if (activo >= 0 && elementos.length) ubicarCarteles(); });
} catch (e) {
  console.error(e);
  fallo(/NotAllowed|Permission/i.test(String(e)) ? t('ra_permiso') : t('ra_sin_camara'));
}
addEventListener('pagehide', () => { try { mind.stop(); } catch { } });
</script>
</body>
</html>
